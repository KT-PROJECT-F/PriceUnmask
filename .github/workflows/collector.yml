name: Collector
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run single scrape cycle
        run: |
          python -c "from backend.db.database import init_db; init_db(); from backend.scheduler.jobs import run_scrape_cycle; run_scrape_cycle()"
      - name: Upload DB as artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: priceunmask-db
          path: data/priceunmask.db
          retention-days: 7

env:
  DATABASE_URL: "sqlite:///data/priceunmask.db"
  SCRAPE_MAX_PAGES: "3"
  SCRAPE_INTERVAL_HOURS: "4"