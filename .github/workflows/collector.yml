name: Collector
on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/priceunmask.db
          key: priceunmask-db-${{ github.run_id }}
          restore-keys: |
            priceunmask-db-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run single scrape cycle
        run: |
          python -c "from backend.db.database import init_db; init_db(); from backend.scheduler.jobs import run_scrape_cycle; run_scrape_cycle()"
    
env:
  DATABASE_URL: "sqlite:///data/priceunmask.db"
  SCRAPE_MAX_PAGES: "3"
  SCRAPE_TARGET_URLS: "https://books.toscrape.com/"
  SCRAPE_INTERVAL_HOURS: "4"