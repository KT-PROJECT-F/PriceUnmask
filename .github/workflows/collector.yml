name: Collector

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run single scrape cycle
        run: |
          python -c "from backend.db.database import init_db; init_db(); from backend.scheduler.jobs import run_scrape_cycle; run_scrape_cycle()"
      - name: Commit DB back to branch
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add -f data/priceunmask.db
          git diff --staged --quiet || git commit -m "data: update price history [skip ci]"
          git push

env:
  DATABASE_URL: "sqlite:///data/priceunmask.db"
  SCRAPE_MAX_PAGES: "3"
  SCRAPE_INTERVAL_HOURS: "4"