name: Deploy

on:
  push:
    branches: [dev]

# Prevent two deploys from running at the same time.
# The second deploy waits instead of clobbering the first one.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # DISABLED until a real VPS is provisioned - #244 PR 2
    if: false
    runs-on: ubuntu-latest
    steps:
      # Pinned to a full commit SHA, not a moving tag.
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: appleboy/ssh-action@029f5b4aeeeb58fdfe1410a5d17f967dacf36262 #v1.0.3
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/priceunmask/current
            bash deploy/deploy.sh ${{ github.sha }}