name: Deploy to VPS

# No real host yet - DO NOT RUN until host exists (from #244)
# Manual only
on:
  workflow_dispatch:
    inputs:
      sha:
        description: 'Commit SHA to deploy (40 hex chars)'
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Disabled until a real host exists. If someone clicks Run workflow, nothing runs.
    if: false
    runs-on: ubuntu-latest
    steps:
      - name: Checkout deploy script
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.sha }}

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            bash /tmp/deploy/deploy.sh ${{ inputs.sha }}