name: Gatekeeper

# Runs on every PR that targets main. Passes only when the PR comes from `dev`
# in this same repository. Anything else fails and gets a friendly comment.
on:
  pull_request:
    branches: [main]
    types: [opened, reopened, edited, synchronize]

permissions:
  contents: read
  pull-requests: write

jobs:
  source-branch-check:
    name: Source branch check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/github-script@v7
        with:
          script: |
            const pr = context.payload.pull_request;
            const source = pr.head.ref;
            const sameRepo = pr.head.repo && pr.head.repo.full_name === `${context.repo.owner}/${context.repo.repo}`;

            if (source === 'dev' && sameRepo) {
              core.info('OK: dev -> main');
              return;
            }

            // Comment only when the PR is opened/reopened or its base branch was changed,
            // so we do not spam a comment on every push.
            const action = context.payload.action;
            const baseChanged = action === 'edited' && context.payload.changes && context.payload.changes.base;
            if (action === 'opened' || action === 'reopened' || baseChanged) {
              const body = [
                `### This PR targets \`main\`, but only \`dev\` can merge into \`main\``,
                ``,
                `Hi @${pr.user.login}, your branch \`${source}\` should target **\`dev\`**.`,
                ``,
                `**Fix it in 10 seconds:** click **Edit** next to the PR title, change the base branch from \`main\` to \`dev\`, and save.`,
                ``,
                `See CONTRIBUTING.md for the full workflow.`
              ].join('\n');
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: pr.number,
                body
              });
            }

            core.setFailed(`PRs into main must come from dev (got: ${source}).`);
