name: Health Check
on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore database cache
        uses: actions/cache@v4
        with:
          path: data/priceunmask.db
          key: priceunmask-db-${{ github.run_id }}
          restore-keys: |
            priceunmask-db-
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Run automated health check
        id: check
        run: |
          set +e
          python -m backend.devtools.check_db 2>&1 | tee health.log
          echo "exit_code=$?" >> $GITHUB_OUTPUT
          cat health.log
      - name: Summary
        if: always()
        run: |
          echo "## Collector Health" >> $GITHUB_STEP_SUMMARY
          cat health.log >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if grep -q "CHECK REQUIRED" health.log; then
            echo "**Status: CHECK REQUIRED**" >> $GITHUB_STEP_SUMMARY
            echo "::warning::CHECK REQUIRED"
            exit 1
          elif grep -q "HEALTHY" health.log && [ "${{ steps.check.outputs.exit_code }}" = "0" ]; then
            echo "**Status: HEALTHY**" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Status: FAILED - Cannot read database or crashed**" >> $GITHUB_STEP_SUMMARY
            echo "**Note: dev is protected, plain git push won't work for persistence. Needs data branch or external storage.**" >> $GITHUB_STEP_SUMMARY
            echo "::error::Health check crashed / DB missing"
            exit 1
          fi

env:
  DATABASE_URL: "sqlite:///data/priceunmask.db"