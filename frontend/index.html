<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PriceUnmask</title>
  <link
    href="https://fonts.googleapis.com/css2?family=Newsreader:ital,wght@0,500;0,600;1,500&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
    rel="stylesheet"
  />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PriceUnmask</h1>
    <p>Is that discount real?</p>
  </header>
  <main id="app">
    <div id="search-box">
      <label class="eyebrow" for="product-search">SEARCH</label>
      <input
        id="product-search"
        type="search"
        placeholder="Search products..."
        autocomplete="off"
      />
    </div>
    <section
      id="collector-status"
      class="collector-status"
      aria-labelledby="collector-status-heading"
      aria-live="polite"
    >
      <h2 id="collector-status-heading">Price Collection Status</h2>
      <p id="collector-status-message">Loading collector status...</p>
      <button id="run-collector-button" type="button">
        Run now
      </button>
      <p id="collector-action-message" role="status" aria-live="polite"></p>
    </section>
    <section
      id="price-drop-notifications"
      class="price-drop-notifications"
      aria-labelledby="price-drop-heading"
    >
      <h2 id="price-drop-heading">
        Price-Drop Notifications
      </h2>

      <p id="notification-status" role="status" aria-live="polite">
        Checking watched products...
      </p>

      <div id="notification-list"></div>
    </section>
    <section
      id="category-trends"
      class="category-trends"
      aria-labelledby="category-trends-heading"
    >
      <h2 id="category-trends-heading">Category &amp; Price Trends</h2>

      <div class="category-filter">
        <label for="category-select">Filter by Category</label>
        <select id="category-select">
          <option value="all">All Categories</option>
        </select>
      </div>

      <p id="category-trends-status" role="status">
        Loading category and trend information...
      </p>
      <div class="category-filter">
        <label for="trend-product-select">Select Product for Price Trend</label>
        <select id="trend-product-select">
          <option value="">Choose a product</option>
        </select>
      </div>
      <div class="trend-chart-container">
        <h3>Price Trends</h3>
        <canvas
          id="category-trend-chart"
          role="img"
          aria-label="Price history chart for the selected product">
        </canvas>
      </div>
    </section>
    <p id="product-status">Loading products...</p>
    <!-- Product grid and detail view are rendered by script.js. -->
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script.js"></script>
</body>
</html>
