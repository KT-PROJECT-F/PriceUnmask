<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>PriceUnmask</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <header>
    <h1>PriceUnmask</h1>
    <p>Is that discount real?</p>
  </header>
  <main id="app">
    <div id="search-box">
      <label for="product-search">Search products</label>
      <input
        id="product-search"
        type="search"
        placeholder="Search products..."
        autocomplete="off"
      />
    </div>
    <p id="product-status">Loading products...</p>
    <!-- Product grid and detail view are rendered by script.js. -->
  </main>
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
  <script src="script.js"></script>
</body>
</html>
